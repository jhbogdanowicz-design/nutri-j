<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente para a haste do J (Azul Royal a Verde Esmeralda) -->
    <linearGradient id="haste-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="60%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <!-- Gradiente para as folhas (Verde Esmeralda a Verde Limão) -->
    <linearGradient id="folha-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Gradiente para o orvalho (Brilho Turquesa/Branco) -->
    <linearGradient id="dew-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.2" />
    </linearGradient>
    
    <!-- Sombra suave para dar profundidade premium -->
    <filter id="premium-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F4C81" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#premium-shadow)">
    <!-- Folha do Topo (Maior) -->
    <path d="M 300,130 C 335,115 390,95 415,35 C 365,60 320,110 300,130 Z" fill="url(#folha-grad)" />
          
    <!-- Nervura central da folha do topo para detalhe premium -->
    <path d="M 300,130 C 335,100 370,70 415,35" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3" fill="none" />

    <!-- Folha do Meio (Média) -->
    <path d="M 300,220 C 330,210 375,190 395,140 C 355,160 315,195 300,220 Z" fill="url(#folha-grad)" />
          
    <!-- Nervura central da folha do meio -->
    <path d="M 300,220 C 330,195 360,170 395,140" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />

    <!-- Haste principal em formato de "J" -->
    <path d="M 300,130 L 300,310 A 90,90 0 0,1 120,310 L 120,250" fill="none" stroke="url(#haste-grad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pequena folha brotando na ponta esquerda do J, para dar equilíbrio absoluto e charme! -->
    <path d="M 120,250 C 105,225 75,205 55,195 C 85,210 110,235 120,250 Z" fill="url(#folha-grad)" />
          
    <!-- Gotinha de orvalho na folha do topo (círculo com gradiente de brilho) -->
    <circle cx="370" cy="75" r="10" fill="url(#dew-grad)" />
    <!-- Brilho do orvalho -->
    <circle cx="367" cy="72" r="3" fill="#ffffff" opacity="0.7" />
  </g>
</svg>